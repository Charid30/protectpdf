<header class="bg-gray-900 shadow-lg">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2" (click)="fermerMenu()">
      <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
      <span class="text-xl font-bold tracking-tight">
        <span class="text-white">SecurPDF</span><span class="text-green-500">BF</span>
      </span>
    </a>

    <!-- Nav desktop -->
    <nav class="hidden sm:flex items-center gap-1">
      <a routerLink="/" routerLinkActive="text-green-400 bg-gray-800" [routerLinkActiveOptions]="{exact: true}"
         class="text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        Accueil
      </a>

      <!-- Dropdown Outils -->
      <div id="outils-dropdown" class="relative">
        <button
          class="flex items-center gap-1 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors"
          (click)="toggleOutils()"
        >
          Outils
          <svg class="w-4 h-4 transition-transform" [class.rotate-180]="outilsOuverts()" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </button>

        @if (outilsOuverts()) {
          <div class="absolute right-0 top-full mt-1 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
            <a routerLink="/proteger" (click)="fermerOutils()"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors">
              <span class="w-6 h-6 rounded-md bg-green-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
              </span>
              Sécuriser un PDF
            </a>
            <a routerLink="/compresser" (click)="fermerOutils()"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors">
              <span class="w-6 h-6 rounded-md bg-blue-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 3.75H6.912a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H15M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859M12 3v8.25m0 0l-3-3m3 3l3-3"/>
                </svg>
              </span>
              Compresser un PDF
            </a>
            <div class="my-1 border-t border-gray-100"></div>
            <a routerLink="/deverrouiller-pdf" (click)="fermerOutils()"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-orange-50 hover:text-orange-700 transition-colors">
              <span class="w-6 h-6 rounded-md bg-orange-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-orange-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
              </span>
              Déverrouiller un PDF
            </a>
            <a routerLink="/deverrouiller-word" (click)="fermerOutils()"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
              <span class="w-6 h-6 rounded-md bg-indigo-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
              </span>
              Déverrouiller un Word
            </a>
            <div class="my-1 border-t border-gray-100"></div>
            <a routerLink="/fusionner" (click)="fermerOutils()"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-purple-50 hover:text-purple-700 transition-colors">
              <span class="w-6 h-6 rounded-md bg-purple-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-3.5 h-3.5 text-purple-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/>
                </svg>
              </span>
              Fusionner des PDFs
            </a>
          </div>
        }
      </div>
    </nav>

    <!-- Bouton menu mobile -->
    <button
      class="sm:hidden w-9 h-9 flex items-center justify-center text-gray-300 hover:text-white hover:bg-gray-800 rounded-lg transition-colors"
      (click)="toggleMenu()"
      aria-label="Menu"
    >
      @if (menuOuvert()) {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      }
    </button>
  </div>

  <!-- Menu mobile -->
  @if (menuOuvert()) {
    <nav class="sm:hidden border-t border-gray-800 px-4 py-3 space-y-1">
      <a routerLink="/" routerLinkActive="text-green-400 bg-gray-800" [routerLinkActiveOptions]="{exact: true}"
         (click)="fermerMenu()"
         class="block text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        Accueil
      </a>
      <a routerLink="/proteger" routerLinkActive="text-green-400 bg-gray-800" (click)="fermerMenu()"
         class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>Sécuriser un PDF
      </a>
      <a routerLink="/compresser" routerLinkActive="text-blue-400 bg-gray-800" (click)="fermerMenu()"
         class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>Compresser un PDF
      </a>
      <a routerLink="/deverrouiller-pdf" routerLinkActive="text-orange-400 bg-gray-800" (click)="fermerMenu()"
         class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>Déverrouiller un PDF
      </a>
      <a routerLink="/deverrouiller-word" routerLinkActive="text-indigo-400 bg-gray-800" (click)="fermerMenu()"
         class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>Déverrouiller un Word
      </a>
      <a routerLink="/fusionner" routerLinkActive="text-purple-400 bg-gray-800" (click)="fermerMenu()"
         class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-gray-800 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
        <span class="w-2 h-2 rounded-full bg-purple-500"></span>Fusionner des PDFs
      </a>
    </nav>
  }
</header>
